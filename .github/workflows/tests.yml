name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system libraries required by the 'gui' extra (PySide6)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0
      - name: Install the package with its 'gui' extra
        run: pip install -e ".[gui]"
      - name: Run unit tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
